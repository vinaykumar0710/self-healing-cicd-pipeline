
services:
  app-blue:
    image: ${BLUE_IMAGE:-self-healing-cicd:local}
    build:
      context: .
    environment:
      APP_VERSION: ${BLUE_VERSION:-v1}
      HEALTH_STATUS: ${BLUE_HEALTH_STATUS:-healthy}
    expose:
      - "5000"
    restart: unless-stopped

  app-green:
    image: ${GREEN_IMAGE:-self-healing-cicd:local}
    build:
      context: .
    environment:
      APP_VERSION: ${GREEN_VERSION:-v2}
      HEALTH_STATUS: ${GREEN_HEALTH_STATUS:-healthy}
    expose:
      - "5000"
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped
